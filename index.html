<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>29Lab RPG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      border: 2px solid #444;
      image-rendering: pixelated;
    }
    #ui-layer {
      position: absolute;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script src="src/engine.js"></script>
  <script src="src/map.js"></script>
  <script src="src/player.js"></script>
  <script src="src/npc.js"></script>
  <script src="src/inventory.js"></script>
  <script src="src/equipment.js"></script>
  <script src="src/battle.js"></script>
  <script src="src/cooking.js"></script>
  <script src="src/crafting.js"></script>
  <script src="src/status.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
